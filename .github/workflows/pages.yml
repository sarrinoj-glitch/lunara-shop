# Публикация витрины LUNARA на GitHub Pages (статический демо-режим, без Supabase).
# Ветка main → https://<owner>.github.io/<repo>/
# Старый адрес второй версии /v2/ перенаправляет на главную (v2 стала основной 2026-11-16).
# Запускается на push в main и вручную из вкладки Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STATIC_EXPORT: '1'
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # Номер WhatsApp владелицы: Settings → Secrets and variables → Actions → Variables
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER || '79990000000' }}
      NEXT_PUBLIC_WHATSAPP_DISPLAY: ${{ vars.WHATSAPP_DISPLAY || '+7 (999) 000-00-00' }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
      - name: Redirect /v2/ → главная
        run: |
          mkdir -p out/v2
          cat > out/v2/index.html <<HTML
          <!doctype html><html lang="ru"><head><meta charset="utf-8">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=${NEXT_PUBLIC_BASE_PATH}/">
          <link rel="canonical" href="${NEXT_PUBLIC_SITE_URL}/">
          <title>LUNARA</title></head>
          <body><a href="${NEXT_PUBLIC_BASE_PATH}/">LUNARA</a></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
